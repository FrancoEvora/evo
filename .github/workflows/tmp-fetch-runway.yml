name: Temporary Runway Asset Bridge
on:
  push:
    paths:
      - '.tmp-runway-fetch-trigger.txt'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and normalize image
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat .tmp-runway-fetch-trigger.txt | head -n1)"
          curl -L --fail --retry 3 "$URL" -o /tmp/asset.png
          ffmpeg -y -loglevel error -i /tmp/asset.png -vf "scale=478:850:flags=lanczos" -q:v 2 .tmp-runway-asset.jpg
          base64 -w0 .tmp-runway-asset.jpg > .tmp-runway-asset.b64
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp-runway-asset.jpg .tmp-runway-asset.b64
          git commit -m "Temporary normalized Runway asset" || exit 0
          git push
