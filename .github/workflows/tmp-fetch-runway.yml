name: Temporary Runway Asset Bridge
on:
  push:
    paths:
      - '.tmp-runway-fetch-trigger6.txt'
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split existing temporary image payload
        shell: bash
        run: |
          set -euo pipefail
          rm -f .tmp-runway-chunk-*
          split -b 40000 -d -a 3 .tmp-runway-asset.b64 .tmp-runway-chunk-
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .tmp-runway-chunk-*
          git commit -m "Rechunk temporary Runway asset into four parts" || exit 0
          git push
